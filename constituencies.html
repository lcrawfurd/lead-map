const COLOR_BREAKS = [0, 1, 2, 3, 4, 5];

function getColor(val) {
    if (val == null || isNaN(val)) return '#444';
    const pct = val * dataScale;
    for (let i = COLOR_BREAKS.length - 1; i >= 0; i--) {
        if (pct >= COLOR_BREAKS[i]) return COLORS[i];
    }
    return COLORS[0];
}

function fmtPct(val) {
    if (val == null || isNaN(val)) return '?';
    return (val * dataScale).toFixed(1) + '%';
}

const info = L.control({ position: 'topright' });
info.onAdd = function () {
    this._div = L.DomUtil.create('div', 'info-panel');
    this.update();
    return this._div;
};
info.update = function (props, data, source, ladName) {
    if (!props) {
        this._div.innerHTML = '<h4>UK Lead Exposure</h4><p class="no-data">Hover over a constituency</p>';
        return;
    }
    const name = props.name;
    const nation = props.nation || '';
    const label = nation && nation !== name ? `${name} <span style="color:#6c7a89; font-size:0.8rem;">(${nation})</span>` : name;
    if (!data) {
        this._div.innerHTML = `<h4>${label}</h4><p class="no-data">No data loaded</p>`;
        return;
    }
    const isNationFallback = source === 'nation' || source === 'national (UK)';
    const isCountyMatch = source === 'county/UA';
    const popStr = (!isNationFallback && data.population) ? `<p class="ci">Population: ${Math.round(data.population).toLocaleString()}</p>` : '';
    let sourceNote = '';
    if (isNationFallback) {
        sourceNote = `<p style="color:#e94560; font-size:0.78rem; margin-top:4px;">No local data — showing ${source}-level estimate</p>`;
    } else if (isCountyMatch) {
        sourceNote = `<p style="color:#4ecca3; font-size:0.78rem; margin-top:4px;">Matched to: ${ladName || 'unknown'}</p>`;
    }
    this._div.innerHTML = `
        <h4>${label}</h4>
        <p>Proportion with BLL ≥ 5 µg/dL</p>
        <p class="value" ${isNationFallback ? 'style="opacity:0.7"' : ''}>${fmtPct(data.mean)}</p>
        <p class="ci">95% UI: ${fmtPct(data.lower)} – ${fmtPct(data.upper)}</p>
        ${popStr}
        <p class="ci" style="margin-top:4px;">Age group: ${selectedAge || 'N/A'}</p>
        ${sourceNote}
        ${source ? `<p class="source-label">Source: ${source}-level data</p>` : ''}
    `;
};
info.addTo(map);

// ── Legend ───────────────────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    let html = '<h4>% with BLL ≥ 5 µg/dL</h4>';
    for (let i = 0; i < COLORS.length; i++) {
        const lo = COLOR_BREAKS[i];
        const hi = lo + 1;
        html += `<div class="legend-item"><span class="legend-color" style="background:${COLORS[i]}"></span>${lo}–${hi}%</div>`;
    }
    html += `<div class="legend-item" style="margin-top:6px; border-top:1px solid #0f3460; padding-top:6px;"><span class="legend-color" style="background:#444"></span>No data</div>`;
    html += `<div class="legend-item"><span class="legend-color" style="background:rgba(254,217,118,0.35); border:1px dashed #0f3460;"></span>Nation-level estimate</div>`;
    div.innerHTML = html;
    return div;
};
legend.addTo(map);

// ── Data lookup: exact match -> spatial LAD match -> nation fallback ─
function getDataForFeature(props) {
    if (!selectedAge) return { data: null, source: null };
    const name = props.name;
    const nation = props.nation;

    // Try exact match on constituency name
    if (csvLocationData[name] && csvLocationData[name][selectedAge]) {
        return { data: csvLocationData[name][selectedAge], source: 'constituency' };
    }
    // Try spatial match: constituency -> county/UA
    const mappedCounty = CONSTITUENCY_TO_COUNTY[name];
    if (mappedCounty && csvLocationData[mappedCounty] && csvLocationData[mappedCounty][selectedAge]) {
        return { data: csvLocationData[mappedCounty][selectedAge], source: 'county/UA', ladName: mappedCounty };
    }
    // Fall back to nation-level data
    if (nation && csvLocationData[nation] && csvLocationData[nation][selectedAge]) {
        return { data: csvLocationData[nation][selectedAge], source: 'nation' };
    }
    // Try "United Kingdom" as last resort
    if (csvLocationData['United Kingdom'] && csvLocationData['United Kingdom'][selectedAge]) {
        return { data: csvLocationData['United Kingdom'][selectedAge], source: 'national (UK)' };
    }
    return { data: null, source: null };
}

// ── Load GeoJSON (constituency boundaries) ──────────────────────────
fetch('uk_constituencies.json')
    .then(r => {
        if (!r.ok) throw new Error('Failed to load uk_constituencies.json');
        return r.json();
    })
    .then(data => {
        ukGeoJSON = data;
        document.getElementById('loading-msg').remove();
        renderMap();
        autoLoadCSV();
    })
    .catch(err => {
        document.getElementById('loading-msg').textContent = 'Error loading boundaries: ' + err.message;
        console.error(err);
    });

// ── Render map ──────────────────────────────────────────────────────
function renderMap() {
    if (geoLayer) map.removeLayer(geoLayer);
    if (!ukGeoJSON) return;

    geoLayer = L.geoJSON(ukGeoJSON, {
        style: featureStyle,
        onEachFeature: onEachFeature
    }).addTo(map);
}

function featureStyle(feature) {
    const { data, source } = getDataForFeature(feature.properties);
    const isNationFallback = source === 'nation' || source === 'national (UK)';
    return {
        fillColor: data ? getColor(data.mean) : '#444',
        weight: isNationFallback ? 0.5 : 1,
        opacity: 0.8,
        color: '#0f3460',
        fillOpacity: isNationFallback ? 0.35 : 0.8,
        dashArray: isNationFallback ? '4 3' : null
    };
}

function onEachFeature(feature, layer) {
    layer.on({
        mouseover: function (e) {
            e.target.setStyle({ weight: 2, color: '#e94560', fillOpacity: 0.95 });
            e.target.bringToFront();
            const { data, source, ladName } = getDataForFeature(feature.properties);
            info.update(feature.properties, data, source, ladName);
        },
        mouseout: function (e) {
            geoLayer.resetStyle(e.target);
            info.update();
        },
        click: function (e) {
            map.fitBounds(e.target.getBounds());
        }
    });
}

// ── CSV loading ─────────────────────────────────────────────────────
const ageSelect = document.getElementById('age-select');

function autoLoadCSV() {
    const csvFile = 'IHME_GBD_2021_LEAD_RISK_1990_2021_PROP_ABOVE_5_2021_BOTH_Y2024M06D05.CSV';
    fetch(csvFile)
        .then(r => {
            if (!r.ok) throw new Error('Bundled CSV not found');
            return r.text();
        })
        .then(text => {
            const results = Papa.parse(text, { header: true, skipEmptyLines: true });
            processCSV(results.data);
        })
        .catch(err => {
            console.error('Could not load bundled CSV:', err);
        });
}

function processCSV(rows) {
    if (rows.length === 0) return;

    const cols = Object.keys(rows[0]);
    const locCol = cols.find(c => /location_name/i.test(c)) || cols.find(c => /location/i.test(c));
    const meanCol = cols.find(c => /^mean$/i.test(c)) || cols.find(c => /^val$/i.test(c));
    const lowerCol = cols.find(c => /^lower$/i.test(c));
    const upperCol = cols.find(c => /^upper$/i.test(c));
    const ageCol = cols.find(c => /age_group_name/i.test(c)) || cols.find(c => /age_group/i.test(c)) || cols.find(c => /age/i.test(c));
    const measureCol = cols.find(c => /measure_name/i.test(c));
    const popCol = cols.find(c => /population/i.test(c));

    if (!locCol || !meanCol) return;

    // Build a set of all feature names for matching
    // Include constituency names, mapped LAD names, nations
    const featureNames = new Set();
    if (ukGeoJSON) {
        ukGeoJSON.features.forEach(f => featureNames.add(f.properties.name));
    }
    Object.values(CONSTITUENCY_TO_COUNTY).forEach(c => featureNames.add(c));
    NATIONS.forEach(n => featureNames.add(n));
    featureNames.add('United Kingdom');

    // Parse all rows, keeping proportion rows that match a UK location
    csvLocationData = {};
    const ageSet = new Set();
    let matchedConstituencies = 0;
    let matchedNations = 0;

    rows.forEach(row => {
        if (measureCol && row[measureCol] && row[measureCol].trim() !== 'Proportion') return;

        const loc = (row[locCol] || '').trim();
        if (!featureNames.has(loc)) return;

        const mean = parseFloat(row[meanCol]);
        if (isNaN(mean)) return;

        const lower = lowerCol ? parseFloat(row[lowerCol]) : null;
        const upper = upperCol ? parseFloat(row[upperCol]) : null;
        const age = ageCol ? (row[ageCol] || '').trim() : 'All';
        const pop = popCol ? parseFloat(row[popCol]) : null;

        if (!csvLocationData[loc]) csvLocationData[loc] = {};
        csvLocationData[loc][age] = {
            mean,
            lower: isNaN(lower) ? null : lower,
            upper: isNaN(upper) ? null : upper,
            population: isNaN(pop) ? null : pop
        };
        ageSet.add(age);

        if (NATIONS.includes(loc) || loc === 'United Kingdom') matchedNations++;
        else matchedConstituencies++;
    });

    const locCount = Object.keys(csvLocationData).length;
    if (locCount === 0) return;

    // Auto-detect scale
    let maxMean = 0;
    for (const loc of Object.values(csvLocationData)) {
        for (const ag of Object.values(loc)) {
            if (ag.mean > maxMean) maxMean = ag.mean;
        }
    }
    dataScale = maxMean > 1 ? 1 : 100;

    // Populate age groups
    ageGroups = Array.from(ageSet).sort();
    ageSelect.innerHTML = '';
    ageGroups.forEach(ag => {
        const opt = document.createElement('option');
        opt.value = ag; opt.textContent = ag;
        ageSelect.appendChild(opt);
    });
    ageSelect.disabled = false;

    const preferred = ageGroups.find(a => a === '0 to 14')
        || ageGroups.find(a => a === '<5')
        || ageGroups.find(a => /all\s*ages/i.test(a))
        || ageGroups[0];
    selectedAge = preferred;
    ageSelect.value = selectedAge;

    renderMap();
}

// Age group change
ageSelect.addEventListener('change', () => {
    selectedAge = ageSelect.value;
    renderMap();
});
</script>
